<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小波绘词 设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero glass">
        <div>
          <p class="eyebrow">小波绘词</p>
          <h1>填写模型配置后即可开始使用</h1>
          <p class="subtitle">当前版本采用自备 API Key 模式，插件不会内置或提供 API Key。</p>
        </div>
      </section>

      <section class="grid">
        <form id="settings-form" class="glass card">
          <section class="field-group">
            <div class="section-head">
              <h2>提示词识别</h2>
              <p>识图服务商、URL、模型和 API Key 独立配置，可与生图自由组合。</p>
            </div>

            <label class="field">
              <span>识图服务商</span>
              <div class="provider-select" data-select-name="promptProvider">
                <select name="promptProvider" hidden>
                  <option value="gemini">Gemini</option>
                  <option value="openai-compatible">OpenAI Compatible</option>
                  <option value="volcengine">火山引擎</option>
                </select>
                <button type="button" class="provider-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="provider-select-value">Gemini</span>
                  <span class="provider-select-chevron" aria-hidden="true"></span>
                </button>
                <ul class="provider-select-menu" role="listbox" hidden></ul>
              </div>
            </label>

            <label class="field">
              <span>识图接口地址</span>
              <input name="promptBaseUrl" type="text" placeholder="https://api.example.com" autocomplete="off" />
              <small id="prompt-base-url-help">中转站通常只填域名即可，例如 `https://api.klong.lat`；插件会自动补全 `/v1`。</small>
            </label>

            <label class="field">
              <span>识别图片模型 API Key</span>
              <input name="promptApiKey" type="password" placeholder="请填入你的 API Key" autocomplete="off" />
              <small>只保存在本地 `chrome.storage.local`，不会写入代码仓库。</small>
            </label>

            <label class="field">
              <span>识别图片模型</span>
              <input name="promptModel" type="text" placeholder="gemini-3.1-pro-preview" />
              <small id="prompt-model-help">Gemini 例如 `gemini-3.1-pro-preview`；OpenAI 兼容默认可用 `gpt-4o`。</small>
            </label>

            <label class="field toggle">
              <span>打开面板后自动识别</span>
              <input name="autoAnalyze" form="settings-form" type="checkbox" />
            </label>
          </section>

          <section class="field-group">
            <div class="section-head">
              <h2>生图</h2>
              <p>生图服务商、URL、模型和 API Key 独立配置，可与识图自由组合。</p>
            </div>

            <label class="field toggle">
              <span>开启生图功能</span>
              <input name="imageGenerationEnabled" form="settings-form" type="checkbox" />
            </label>

            <div id="image-settings-group" class="field-stack">
              <label class="field">
                <span>生图服务商</span>
                <div class="provider-select" data-select-name="imageProvider">
                  <select name="imageProvider" hidden>
                    <option value="gemini">Gemini</option>
                    <option value="openai-compatible">OpenAI Compatible</option>
                    <option value="volcengine">火山引擎</option>
                  </select>
                  <button type="button" class="provider-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                    <span class="provider-select-value">Gemini</span>
                    <span class="provider-select-chevron" aria-hidden="true"></span>
                  </button>
                  <ul class="provider-select-menu" role="listbox" hidden></ul>
                </div>
              </label>

              <label class="field">
                <span>生图接口地址</span>
                <input name="imageBaseUrl" type="text" placeholder="https://api.example.com" autocomplete="off" />
                <small id="image-base-url-help">中转站通常只填域名即可；已含 `/v1` 或自定义路径时会按原样保留。</small>
              </label>

              <label class="field">
                <span>生图模型 API Key</span>
                <input name="imageApiKey" type="password" placeholder="请填入你的 API Key" autocomplete="off" />
                <small>识图和生图可用同一个 Key，也可以完全分开。</small>
              </label>

              <label class="field">
                <span>生图模型</span>
                <input name="imageModel" type="text" placeholder="gemini-3.1-flash-image-preview" />
                <small id="image-model-help">Gemini 例如 `gemini-3.1-flash-image-preview`；OpenAI 兼容默认可用 `gpt-image-2`。</small>
              </label>
            </div>
          </section>

          <div class="actions">
            <button class="primary" type="submit">保存设置</button>
            <button id="open-history" type="button">打开历史记录</button>
            <button id="open-doc" type="button">查看文档</button>
          </div>
          <p class="note">提示：这是一个自备 API Key 模式的插件，安装后需要填写自己的 API Key 才能使用。</p>
          <p id="status" class="status">读取设置中...</p>
        </form>
      </section>
    </main>

    <script src="./options.js"></script>
  </body>
</html>
